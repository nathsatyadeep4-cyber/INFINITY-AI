name: Build INFINITY AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Project ZIP
        shell: bash
        run: |
          if ! find . -name gradlew -type f | grep -q .; then
            ZIP_FILE=$(find . -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Project ZIP not found"
              exit 1
            fi
            mkdir -p source
            unzip -q "$ZIP_FILE" -d source
          fi

      - name: Find Android Project
        shell: bash
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INFINITY-AI-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
