name: Build INFINITY AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Extract Project ZIP
        shell: bash
        run: |
          if ! find . -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name gradlew \) | grep -q .; then
            ZIP_FILE=$(find . -type f -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android Gradle project or project ZIP found."
              exit 1
            fi
            mkdir -p source
            unzip -q "$ZIP_FILE" -d source
          fi

      - name: Locate Android Gradle Project
        id: project
        shell: bash
        run: |
          PROJECT_FILE=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) -not -path './.git/*' | head -n 1)
          fi
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No settings.gradle or build.gradle found after extracting the ZIP."
            echo "ZIP contents:"
            find source -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project directory: $PROJECT_DIR"
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"
          else
            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ "$USE_WRAPPER" = "true" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INFINITY-AI-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
