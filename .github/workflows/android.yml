name: Build INFINITY AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Project ZIP
        shell: bash
        run: |
          ZIP_COUNT=$(find . -type f -name '*.zip' -not -path './.git/*' | wc -l)
          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "No project ZIP found; checking repository for Gradle files."
          else
            mkdir -p source
            while IFS= read -r ZIP_FILE; do
              echo "Extracting: $ZIP_FILE"
              unzip -oq "$ZIP_FILE" -d source
            done < <(find . -type f -name '*.zip' -not -path './.git/*')
          fi

      - name: Find Android Project
        shell: bash
        run: |
          PROJECT_FILE=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n 1)
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_DIR=$(dirname "$PROJECT_FILE")
          else
            PROJECT_FILE=$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) -not -path './.git/*' | head -n 1)
            if [ -z "$PROJECT_FILE" ]; then
              echo "ERROR: No settings.gradle or build.gradle found. The ZIP may not contain an Android Gradle project."
              exit 1
            fi
            PROJECT_DIR=$(dirname "$PROJECT_FILE")
          fi
          echo "Using Android project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create local debug signing keystore
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INFINITY-AI-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
